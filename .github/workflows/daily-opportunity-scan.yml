name: 🎯 Daily Cloud Bounty Radar

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 9:00 AM CDT (14:00 UTC) in GitHub's cloud
  workflow_dispatch:      # Manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bounty Radar
        run: python3 scripts/bounty-radar.py

      - name: Commit & Push Updated Bounties
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ACTIVE_BOUNTIES.md || true
          if git diff --staged --quiet; then
            echo "No changes detected. Radar is up to date."
          else
            git commit -m "chore: automated daily bounty radar scan [skip ci]" || true
            git push || true
            echo "✅ Finished push attempt."
          fi

